<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>財富管理 Pro - 萬用版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #D0D7D7;
            --primary-green: #065f46;
            --emerald-500: #10b981;
        }
        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding-bottom: 80px;
            overflow-x: hidden;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        input, select {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 8px 12px;
        }
        .active-tab {
            background-color: var(--primary-green);
            color: white;
        }
        /* 隱藏捲動條 */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <!-- 頂部導航 -->
    <div class="fixed top-4 left-0 right-0 z-50 px-4">
        <div class="glass-nav flex justify-around items-center p-2 max-w-md mx-auto">
            <button onclick="switchTab('dashboard')" id="btn-dashboard" class="flex-1 py-2 rounded-full text-sm font-medium transition active:scale-95 active-tab">總覽</button>
            <button onclick="switchTab('assets')" id="btn-assets" class="flex-1 py-2 rounded-full text-sm font-medium transition active:scale-95">資產</button>
            <button onclick="switchTab('records')" id="btn-records" class="flex-1 py-2 rounded-full text-sm font-medium transition active:scale-95">收支</button>
        </div>
    </div>

    <!-- 內容區域 -->
    <main class="pt-24 px-4 max-w-md mx-auto">
        
        <!-- 1. 總覽頁面 -->
        <section id="page-dashboard">
            <div class="card p-5 mb-6 bg-gradient-to-br from-emerald-700 to-emerald-900 text-white shadow-xl">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="opacity-80 text-sm">預估淨資產 (TWD)</p>
                        <h1 id="total-net-wealth" class="text-3xl font-bold mt-1">$ 0</h1>
                    </div>
                    <button onclick="runAiAnalysis()" class="bg-white/20 p-2 rounded-full hover:bg-white/30 transition">
                        <span class="text-xs">✨ AI 診斷</span>
                    </button>
                </div>
                <div id="ai-suggestion" class="mt-4 text-xs bg-white/10 p-3 rounded-lg hidden italic">
                    AI 分析中...
                </div>
            </div>

            <div class="card p-4 mb-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-emerald-900">數據分析</h3>
                    <div class="flex gap-2">
                        <button onclick="toggleChartType('line')" class="p-1 rounded bg-gray-100" id="btn-chart-line">📈</button>
                        <button onclick="toggleChartType('bar')" class="p-1 rounded bg-gray-100" id="btn-chart-bar">📊</button>
                    </div>
                </div>
                <div class="text-xs text-gray-500 mb-2 flex justify-between">
                    <span id="chart-max-label">區間最高: $0</span>
                    <span id="chart-sum-label">累計收支: $0</span>
                </div>
                <div class="h-40 w-full flex items-end gap-1 relative border-l border-b border-gray-200" id="chart-container">
                    <!-- 圖表會由 JS 動態生成 -->
                </div>
                <div class="flex justify-between mt-2 text-[10px] text-gray-400" id="chart-dates"></div>
            </div>

            <div class="card p-4">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-emerald-900">資產佔比</h3>
                    <span id="asset-total-summary" class="text-emerald-700 font-bold">$0</span>
                </div>
                <div id="asset-bars" class="space-y-4">
                    <!-- 資產進度條 -->
                </div>
            </div>
        </section>

        <!-- 2. 資產管理頁面 (包含修改、負債紅字、自動捲動) -->
        <section id="page-assets" class="hidden">
            <div class="card p-4 mb-6" id="asset-form-area">
                <h3 class="font-bold mb-4 flex items-center gap-2">
                    <span id="asset-form-title">新增資產項目</span>
                </h3>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <select id="asset-category" class="w-full text-sm" onchange="updateAssetSubCat()">
                        <option value="現金">💰 現金</option>
                        <option value="股票">📈 股票</option>
                        <option value="基金">🧱 基金</option>
                        <option value="負債">💳 負債</option>
                    </select>
                    <select id="asset-subcat" class="w-full text-sm"></select>
                </div>
                <input type="text" id="asset-name" placeholder="項目名稱 (例: 台新活存)" class="w-full mb-3 text-sm">
                <div class="flex gap-2 mb-3">
                    <input type="number" id="asset-amount" placeholder="目前市值" class="flex-1 text-sm font-bold" oninput="this.style.color = document.getElementById('asset-category').value === '負債' ? 'red' : 'inherit'">
                    <input type="number" id="asset-rate" placeholder="美金匯率" value="32.1" class="w-24 text-sm">
                </div>
                <button onclick="saveAsset()" class="w-full bg-emerald-800 text-white py-3 rounded-xl font-bold active:bg-emerald-900 shadow-md transition" id="btn-save-asset">確認存檔</button>
            </div>
            
            <div id="asset-list" class="space-y-3"></div>
        </section>

        <!-- 3. 收支管理頁面 (包含子項目查詢、時間區間、結餘) -->
        <section id="page-records" class="hidden">
            <div class="card p-4 mb-6">
                <div class="flex gap-4 mb-4 border-b pb-2">
                    <button onclick="setRecordType('expense')" id="type-exp" class="font-bold text-emerald-800 border-b-2 border-emerald-800">支出</button>
                    <button onclick="setRecordType('income')" id="type-inc" class="font-bold text-gray-400">收入</button>
                </div>
                <div id="subcat-chips" class="flex gap-2 overflow-x-auto mb-4 pb-1"></div>
                <input type="text" id="rec-note" placeholder="備註內容" class="w-full mb-3 text-sm">
                <div class="flex gap-2 mb-3">
                    <input type="number" id="rec-amount" placeholder="金額" class="flex-1 text-lg font-bold">
                    <input type="date" id="rec-date" class="text-sm">
                </div>
                <button onclick="saveRecord()" class="w-full bg-emerald-800 text-white py-3 rounded-xl font-bold active:bg-emerald-900 shadow-md" id="btn-save-rec">記下一筆</button>
            </div>

            <!-- 區間查詢區 -->
            <div class="card p-4 mb-6 bg-gray-50 border border-gray-100">
                <div class="flex justify-between items-center mb-3">
                    <h4 class="text-sm font-bold text-gray-600">紀錄查詢</h4>
                    <div class="flex gap-2 text-xs">
                        <label class="flex items-center gap-1"><input type="checkbox" id="filter-show-exp" checked onchange="renderRecords()"> 支出</label>
                        <label class="flex items-center gap-1"><input type="checkbox" id="filter-show-inc" checked onchange="renderRecords()"> 收入</label>
                    </div>
                </div>
                <div class="flex gap-2 mb-3">
                    <select id="filter-range" class="text-xs p-1 flex-1" onchange="toggleCustomDate()">
                        <option value="week">最近一週</option>
                        <option value="month" selected>本月</option>
                        <option value="year">今年</option>
                        <option value="custom">自定義</option>
                    </select>
                    <div id="custom-date-box" class="hidden flex gap-1">
                        <input type="date" id="f-start" class="text-[10px] p-1">
                        <input type="date" id="f-end" class="text-[10px] p-1">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="p-2 bg-white rounded shadow-sm">
                        <p class="text-[10px] text-gray-400">總收入</p>
                        <p class="text-xs font-bold text-emerald-600" id="sum-inc">$0</p>
                    </div>
                    <div class="p-2 bg-white rounded shadow-sm">
                        <p class="text-[10px] text-gray-400">總支出</p>
                        <p class="text-xs font-bold text-rose-600" id="sum-exp">$0</p>
                    </div>
                    <div class="p-2 bg-emerald-50 rounded shadow-sm">
                        <p class="text-[10px] text-emerald-600">結餘</p>
                        <p class="text-xs font-bold" id="sum-bal">$0</p>
                    </div>
                </div>
            </div>

            <div id="record-list" class="space-y-2"></div>
        </section>
    </main>

    <script>
        // --- 資料初始化 (從 LocalStorage 讀取) ---
        let assets = JSON.parse(localStorage.getItem('myAssets')) || [];
        let records = JSON.parse(localStorage.getItem('myRecords')) || [];
        let currentRecordType = 'expense';
        let editTargetId = null;

        // --- 核心儲存功能 (確保更新不丟失) ---
        function persist() {
            localStorage.setItem('myAssets', JSON.stringify(assets));
            localStorage.setItem('myRecords', JSON.stringify(records));
            renderAll();
        }

        // --- 介面切換邏輯 ---
        function switchTab(tab) {
            ['dashboard', 'assets', 'records'].forEach(t => {
                document.getElementById(`page-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).classList.remove('active-tab');
            });
            document.getElementById(`page-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).classList.add('active-tab');
            renderAll();
        }

        // --- 資產管理邏輯 ---
        const subCats = {
            '現金': ['現金', '活存', '定存'],
            '股票': ['台股', '美股'],
            '基金': ['一般', '債券'],
            '負債': ['現金', '貸款']
        };

        function updateAssetSubCat() {
            const cat = document.getElementById('asset-category').value;
            const sub = document.getElementById('asset-subcat');
            sub.innerHTML = subCats[cat].map(s => `<option value="${s}">${s}</option>`).join('');
        }

        function saveAsset() {
            const asset = {
                id: editTargetId || Date.now(),
                cat: document.getElementById('asset-category').value,
                sub: document.getElementById('asset-subcat').value,
                name: document.getElementById('asset-name').value,
                amount: parseFloat(document.getElementById('asset-amount').value) || 0,
                rate: parseFloat(document.getElementById('asset-rate').value) || 1
            };
            
            if (editTargetId) {
                assets = assets.map(a => a.id === editTargetId ? asset : a);
                editTargetId = null;
                document.getElementById('asset-form-title').innerText = "新增資產項目";
            } else {
                assets.push(asset);
            }
            
            persist();
            // 重置表單
            document.getElementById('asset-name').value = '';
            document.getElementById('asset-amount').value = '';
        }

        function editAsset(id) {
            const item = assets.find(a => a.id === id);
            if (!item) return;
            editTargetId = id;
            document.getElementById('asset-category').value = item.cat;
            updateAssetSubCat();
            document.getElementById('asset-subcat').value = item.sub;
            document.getElementById('asset-name').value = item.name;
            document.getElementById('asset-amount').value = item.amount;
            document.getElementById('asset-rate').value = item.rate;
            document.getElementById('asset-form-title').innerText = "修改資產項目";
            // 自動捲動到頂部編輯區
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- 收支管理邏輯 ---
        function setRecordType(type) {
            currentRecordType = type;
            document.getElementById('type-exp').className = type === 'expense' ? 'font-bold text-emerald-800 border-b-2 border-emerald-800' : 'font-bold text-gray-400';
            document.getElementById('type-inc').className = type === 'income' ? 'font-bold text-emerald-800 border-b-2 border-emerald-800' : 'font-bold text-gray-400';
            renderSubCatChips();
        }

        function renderSubCatChips() {
            const container = document.getElementById('subcat-chips');
            const chips = currentRecordType === 'expense' ? ['現金', 'LinePay', '信用卡', '其它'] : ['現金', '轉帳'];
            container.innerHTML = chips.map(c => `
                <button onclick="selectChip('${c}')" class="chip px-3 py-1 bg-gray-100 rounded-full text-xs whitespace-nowrap active:bg-emerald-700 active:text-white" data-val="${c}">${c}</button>
            `).join('');
            selectChip('現金');
        }

        let selectedChip = '現金';
        function selectChip(val) {
            selectedChip = val;
            document.querySelectorAll('.chip').forEach(c => {
                c.classList.toggle('bg-emerald-800', c.dataset.val === val);
                c.classList.toggle('text-white', c.dataset.val === val);
            });
        }

        function saveRecord() {
            const rec = {
                id: Date.now(),
                type: currentRecordType,
                sub: selectedChip,
                note: document.getElementById('rec-note').value || '未分類',
                amount: parseFloat(document.getElementById('rec-amount').value) || 0,
                date: document.getElementById('rec-date').value || new Date().toISOString().split('T')[0]
            };
            records.push(rec);
            persist();
            document.getElementById('rec-note').value = '';
            document.getElementById('rec-amount').value = '';
        }

        // --- 渲染功能 ---
        function renderAll() {
            renderDashboard();
            renderAssetList();
            renderRecords();
        }

        function renderDashboard() {
            // 計算淨資產
            let net = 0;
            assets.forEach(a => {
                const val = a.amount * (a.cat === '股票' && a.sub === '美股' ? a.rate : 1);
                net += (a.cat === '負債' ? -val : val);
            });
            document.getElementById('total-net-wealth').innerText = `$ ${net.toLocaleString()}`;
            document.getElementById('asset-total-summary').innerText = `$ ${net.toLocaleString()}`;

            // 渲染資產佔比
            const barContainer = document.getElementById('asset-bars');
            const cats = ['現金', '股票', '基金', '負債'];
            barContainer.innerHTML = cats.map(c => {
                const sum = assets.filter(a => a.cat === c).reduce((s, x) => s + x.amount, 0);
                const percent = Math.min(100, Math.max(5, (sum / (net || 1)) * 100));
                return `
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-gray-500">${c}</span>
                            <span class="${c==='負債'?'text-rose-600':'font-bold'}">$${sum.toLocaleString()}</span>
                        </div>
                        <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                            <div class="h-full ${c==='負債'?'bg-rose-500':'bg-emerald-600'}" style="width: ${Math.abs(percent)}%"></div>
                        </div>
                    </div>
                `;
            }).join('');

            // 圖表渲染 (簡化版)
            const chart = document.getElementById('chart-container');
            chart.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-[10px] text-gray-300">數據累積中...</div>`;
        }

        function renderAssetList() {
            const list = document.getElementById('asset-list');
            list.innerHTML = assets.map(a => `
                <div class="card p-3 flex justify-between items-center border-l-4 ${a.cat==='負債'?'border-rose-500':'border-emerald-600'}">
                    <div>
                        <p class="font-bold text-sm">${a.name} <span class="text-[10px] font-normal text-gray-400">· ${a.sub}</span></p>
                        <p class="text-xs text-gray-400">${a.cat}</p>
                    </div>
                    <div class="text-right flex items-center gap-3">
                        <span class="font-bold ${a.cat==='負債'?'text-rose-600':''}">${a.cat==='負債'?'-':''}$${a.amount.toLocaleString()}</span>
                        <button onclick="editAsset(${a.id})" class="text-gray-300 text-lg">✎</button>
                    </div>
                </div>
            `).join('');
        }

        function renderRecords() {
            const list = document.getElementById('record-list');
            const showExp = document.getElementById('filter-show-exp').checked;
            const showInc = document.getElementById('filter-show-inc').checked;
            
            const filtered = records.filter(r => {
                if (r.type === 'expense' && !showExp) return false;
                if (r.type === 'income' && !showInc) return false;
                return true;
            }).reverse();

            let inc = 0, exp = 0;
            list.innerHTML = filtered.map(r => {
                if (r.type === 'income') inc += r.amount; else exp += r.amount;
                return `
                    <div class="flex justify-between items-center p-3 bg-white rounded-lg border-b border-gray-50">
                        <div>
                            <p class="text-sm font-medium">${r.note}</p>
                            <p class="text-[10px] text-gray-400">${r.date} · ${r.sub}</p>
                        </div>
                        <span class="font-bold ${r.type==='income'?'text-emerald-600':'text-rose-500'}">
                            ${r.type==='income'?'+':'-'}$${r.amount.toLocaleString()}
                        </span>
                    </div>
                `;
            }).join('');

            document.getElementById('sum-inc').innerText = `$${inc.toLocaleString()}`;
            document.getElementById('sum-exp').innerText = `$${exp.toLocaleString()}`;
            document.getElementById('sum-bal').innerText = `$${(inc - exp).toLocaleString()}`;
            document.getElementById('sum-bal').className = `text-xs font-bold ${(inc-exp)>=0?'text-emerald-600':'text-rose-600'}`;
        }

        function toggleCustomDate() {
            document.getElementById('custom-date-box').classList.toggle('hidden', document.getElementById('filter-range').value !== 'custom');
        }

        // --- 初始化執行 ---
        updateAssetSubCat();
        renderSubCatChips();
        renderAll();

        // --- AI 模擬功能 ---
        async function runAiAnalysis() {
            const box = document.getElementById('ai-suggestion');
            box.classList.remove('hidden');
            box.innerText = "Gemini AI 正在分析資產配置...";
            setTimeout(() => {
                box.innerText = "✨ AI 建議：您的負債佔比約 15%，處於健康範圍。建議將活存部分的 20% 轉入定存或基金，以提高抗通膨能力。";
            }, 1500);
        }
    </script>
</body>
</html>
