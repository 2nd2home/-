<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>財富管家 Pro</title>
    
    <!-- iOS 專用設定：讓網頁看起來像 App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="財富管家">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            -webkit-tap-highlight-color: transparent; 
            background-color: #F8FAFC; 
            font-family: -apple-system, system-ui, sans-serif;
            /* 預留 iPhone 底部橫條空間 */
            padding-bottom: env(safe-area-inset-bottom);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        input[type="date"] { min-height: 2.5rem; -webkit-appearance: none; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.4s ease-out forwards; }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const ASSET_CATEGORIES = {
            cash: { label: '現金/活存', color: '#10b981', subTypes: ['現金', '活存', '定存'] },
            stock: { label: '股票', color: '#059669', subTypes: ['台股', '美股'] },
            fund: { label: '基金', color: '#34d399', subTypes: ['一般基金', '債券基金'] },
            realestate: { label: '不動產', color: '#6ee7b7', subTypes: ['通用'] },
            debt: { label: '負債', color: '#f43f5e', subTypes: ['現金', '貸款'] }
        };

        const TX_SUB_CATEGORIES = {
            expense: ['現金', 'LinePay', '信用卡', '其它'],
            income: ['現金', '轉帳']
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                dashboard: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>,
                swap: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m7 16 3-3-3-3"></path><path d="m17 8-3 3 3 3"></path><path d="M3 16h7"></path><path d="M21 8h-7"></path></svg>,
                list: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line></svg>,
                edit: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"></path></svg>,
                trash: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>,
                calendar: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
                globe: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            };
            return icons[name] || null;
        };

        function App() {
            const today = new Date().toISOString().split('T')[0];
            const [activeTab, setActiveTab] = useState('dashboard');
            const [usdRate, setUsdRate] = useState(32.5);

            const [assets, setAssets] = useState(() => {
                const s = localStorage.getItem('wealth_v28_assets');
                return s ? JSON.parse(s) : [
                    { id: 'a1', name: '中信活存', type: 'cash', subType: '活存', value: 100000, currency: 'TWD', date: '2026-01-01' },
                    { id: 's1', name: '台積電', type: 'stock', subType: '台股', value: 500000, currency: 'TWD', date: '2026-01-15' }
                ];
            });

            const [transactions, setTransactions] = useState(() => {
                const s = localStorage.getItem('wealth_v28_tx');
                return s ? JSON.parse(s) : [
                    { id: 't1', type: 'income', subCategory: '轉帳', amount: 75000, category: '薪資', date: '2026-01-05' }
                ];
            });

            useEffect(() => {
                localStorage.setItem('wealth_v28_assets', JSON.stringify(assets));
                localStorage.setItem('wealth_v28_tx', JSON.stringify(transactions));
            }, [assets, transactions]);

            const formatMoney = (val) => `NT$ ${Math.floor(val).toLocaleString()}`;
            const getTwdValue = (v, curr) => curr === 'USD' ? v * usdRate : v;

            const getAssetsTotalAtDate = (d, list) => {
                const uniqueNames = [...new Set(list.map(a => a.name))];
                let sum = 0;
                uniqueNames.forEach(n => {
                    const records = list.filter(a => a.name === n && a.date <= d).sort((a,b) => b.date.localeCompare(a.date));
                    if (records.length > 0) {
                        const val = getTwdValue(records[0].value, records[0].currency);
                        sum += (records[0].type === 'debt' ? -val : val);
                    }
                });
                return sum;
            };

            const getAccCash = (d, list) => list.filter(t => t.date <= d).reduce((s, t) => t.type === 'income' ? s + t.amount : s - t.amount, 0);

            return (
                <div className="flex flex-col min-h-screen max-w-md mx-auto relative bg-[#F8FAFC]">
                    <header className="p-6 pt-12 pb-4 bg-white border-b sticky top-0 z-30 flex justify-between items-end">
                        <div>
                            <h1 className="text-xl font-black text-emerald-900">財富管家 Pro</h1>
                            <p className="text-[10px] text-emerald-600 font-bold uppercase tracking-widest">Unified Action v29.0</p>
                        </div>
                        <div className="flex items-center gap-2 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-100 shadow-sm">
                            <Icon name="globe" size={12} className="text-emerald-500" />
                            <span className="text-[10px] font-black text-emerald-700">USD</span>
                            <input type="number" value={usdRate} onChange={e=>setUsdRate(Number(e.target.value))} className="w-10 bg-transparent text-[10px] font-black text-emerald-600 outline-none" />
                        </div>
                    </header>

                    <main className="flex-1 p-4 pb-32">
                        {activeTab === 'dashboard' && <Dashboard assets={assets} transactions={transactions} formatMoney={formatMoney} getAssetsTotalAtDate={getAssetsTotalAtDate} getAccCash={getAccCash} />}
                        {activeTab === 'transactions' && <TransactionsManager transactions={transactions} setTransactions={setTransactions} formatMoney={formatMoney} />}
                        {activeTab === 'assets' && <AssetsManager assets={assets} setAssets={setAssets} formatMoney={formatMoney} usdRate={usdRate} />}
                    </main>

                    <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 w-[92%] max-w-md glass-card border border-emerald-100 rounded-[2.5rem] p-1.5 shadow-2xl flex z-40">
                        <NavButton icon="dashboard" label="總覽" active={activeTab==='dashboard'} onClick={()=>setActiveTab('dashboard')} />
                        <NavButton icon="swap" label="收支" active={activeTab==='transactions'} onClick={()=>setActiveTab('transactions')} />
                        <NavButton icon="list" label="資產" active={activeTab==='assets'} onClick={()=>setActiveTab('assets')} />
                    </nav>
                </div>
            );
        }

        function NavButton({ icon, label, active, onClick }) {
            return (
                <button onClick={onClick} className={`flex-1 flex flex-col items-center justify-center py-3 rounded-[2rem] transition-all ${active ? 'bg-emerald-600 text-white shadow-lg' : 'text-slate-400'}`}>
                    <Icon name={icon} size={22} /><span className="text-[10px] font-bold mt-1">{label}</span>
                </button>
            );
        }

        function Dashboard({ assets, transactions, formatMoney, getAssetsTotalAtDate, getAccCash }) {
            const [range, setRange] = useState('month');
            const [customDate, setCustomDate] = useState({ start: '2026-01-01', end: '2026-12-31' });
            const [showAssets, setShowAssets] = useState(true);
            const [showCash, setShowCash] = useState(true);

            const timeConfig = useMemo(() => {
                if (range === 'custom') return customDate;
                const end = new Date('2026-05-07');
                let start = new Date(end);
                if (range === 'week') start.setDate(end.getDate() - 7);
                else if (range === 'month') start.setMonth(end.getMonth() - 1);
                else if (range === 'halfYear') start.setMonth(end.getMonth() - 6);
                else start.setFullYear(end.getFullYear() - 1);
                return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0] };
            }, [range, customDate]);

            const trendData = useMemo(() => {
                const data = [];
                let curr = new Date(timeConfig.start);
                const end = new Date(timeConfig.end);
                if (isNaN(curr.getTime())) return [];
                let safety = 0;
                while (curr <= end && safety < 400) {
                    const dStr = curr.toISOString().split('T')[0];
                    const assetVal = getAssetsTotalAtDate(dStr, assets) + getAccCash(dStr, transactions);
                    const dayTx = transactions.filter(t => t.date === dStr);
                    const netChange = dayTx.reduce((s,t) => t.type === 'income' ? s + t.amount : s - t.amount, 0);
                    data.push({ date: dStr, asset: assetVal, net: netChange });
                    curr.setDate(curr.getDate() + 1);
                    safety++;
                }
                return data;
            }, [timeConfig, assets, transactions]);

            const latestAsset = trendData.length > 0 ? trendData[trendData.length-1].asset : 0;
            const maxAsset = Math.max(...trendData.map(d => d.asset), 0);
            const totalNet = transactions.filter(t => t.date >= timeConfig.start && t.date <= timeConfig.end).reduce((s, t) => t.type === 'income' ? s + t.amount : s - t.amount, 0);

            return (
                <div className="space-y-6 animate-slide-up">
                    <div className="bg-emerald-900 p-8 rounded-[2.5rem] text-white shadow-xl relative overflow-hidden">
                        <p className="text-emerald-400 text-[10px] font-black uppercase tracking-widest mb-1">預估淨資產 (聯動收支)</p>
                        <h2 className="text-4xl font-black tracking-tighter">{formatMoney(latestAsset)}</h2>
                        <div className="flex gap-8 mt-6">
                            <div><p className="text-[9px] font-bold text-emerald-500 uppercase">區間最高</p><p className="font-bold text-sm">{formatMoney(maxAsset)}</p></div>
                            <div><p className="text-[9px] font-bold text-emerald-500 uppercase">區間淨收支</p><p className="font-bold text-sm">{totalNet >= 0 ? '+' : ''}{totalNet.toLocaleString()}</p></div>
                        </div>
                    </div>

                    <div className="flex flex-col gap-4">
                        <div className="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar justify-center w-full">
                            {['week', 'month', 'halfYear', 'year', 'custom'].map(id => (
                                <button key={id} onClick={() => setRange(id)} className={`px-4 py-2 rounded-full text-[10px] font-bold transition-all ${range === id ? 'bg-emerald-600 text-white shadow-md' : 'bg-white text-slate-400 border border-slate-100'}`}>
                                    {id === 'week' ? '一週' : id === 'month' ? '一月' : id === 'halfYear' ? '半年' : id === 'year' ? '一年' : '自訂'}
                                </button>
                            ))}
                        </div>
                        {range === 'custom' && (
                            <div className="flex items-center gap-2 bg-white px-4 py-2 rounded-2xl border border-emerald-100 shadow-sm animate-slide-up">
                                <input type="date" value={customDate.start} onChange={e=>setCustomDate({...customDate, start:e.target.value})} className="bg-transparent text-[10px] font-bold outline-none text-slate-600" />
                                <span className="text-slate-300">~</span>
                                <input type="date" value={customDate.end} onChange={e=>setCustomDate({...customDate, end:e.target.value})} className="bg-transparent text-[10px] font-bold outline-none text-slate-600" />
                            </div>
                        )}
                    </div>

                    <div className="bg-white p-6 rounded-[2rem] border border-emerald-50 shadow-sm">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest">數據分析趨勢</h3>
                            <div className="flex gap-2">
                                <button onClick={()=>setShowAssets(!showAssets)} className={`p-2 rounded-xl border transition-all ${showAssets ? 'bg-emerald-50 border-emerald-100 text-emerald-600' : 'bg-slate-50 text-slate-300'}`}><Icon name="dashboard" size={14}/></button>
                                <button onClick={()=>setShowCash(!showCash)} className={`p-2 rounded-xl border transition-all ${showCash ? 'bg-emerald-50 border-emerald-100 text-emerald-600' : 'bg-slate-50 text-slate-300'}`}><Icon name="swap" size={14}/></button>
                            </div>
                        </div>
                        <Chart data={trendData} showAssets={showAssets} showCash={showCash} />
                    </div>
                </div>
            );
        }

        function Chart({ data, showAssets, showCash }) {
            if (data.length < 2) return <div className="h-40 flex items-center justify-center text-slate-200 italic text-xs font-bold">數據累積中...</div>;
            const PAD = { t: 20, r: 20, b: 30, l: 65 }, W = 1000, H = 400;
            const allV = [...(showAssets ? data.map(d=>d.asset) : []), ...(showCash ? data.map(d=>d.net) : []), 0];
            const max = Math.max(...allV) * 1.1, min = Math.min(...allV) * 1.1, range = (max - min) || 1;
            const getX = (i) => PAD.l + (i / (data.length - 1)) * (W - PAD.l - PAD.r);
            const getY = (v) => PAD.t + (1 - (v - min) / range) * (H - PAD.t - PAD.b);
            const ticks = [min, min + range/2, max];

            return (
                <div className="w-full">
                    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto overflow-visible">
                        {ticks.map((t, i) => (
                            <g key={i}>
                                <line x1={PAD.l} y1={getY(t)} x2={W - PAD.r} y2={getY(t)} stroke="#F1F5F9" strokeWidth="2" />
                                <text x={PAD.l - 12} y={getY(t) + 6} textAnchor="end" className="fill-slate-300 text-[24px] font-bold">{Math.round(t/10000)}萬</text>
                            </g>
                        ))}
                        {showCash && data.map((d, i) => {
                            const bw = ((W-PAD.l-PAD.r)/data.length)*0.7;
                            const h = Math.abs(getY(0)-getY(d.net)), yPos = d.net >= 0 ? getY(d.net) : getY(0);
                            return <rect key={i} x={getX(i)-bw/2} y={yPos} width={bw} height={Math.max(h, 2)} fill={d.net >= 0 ? "#10b981" : "#f43f5e"} opacity="0.3" rx="4" />;
                        })}
                        {showAssets && <path d={`M ${data.map((d, i) => `${getX(i)} ${getY(d.asset)}`).join(' L ')}`} fill="none" stroke="#10b981" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" />}
                        <text x={getX(0)} y={H - 5} className="fill-slate-300 text-[20px] font-bold font-mono">{data[0].date.slice(5)}</text>
                        <text x={getX(data.length-1)} y={H - 5} textAnchor="end" className="fill-slate-300 text-[20px] font-bold font-mono">{data[data.length-1].date.slice(5)}</text>
                    </svg>
                </div>
            );
        }

        function TransactionsManager({ transactions, setTransactions, formatMoney }) {
            const today = new Date().toISOString().split('T')[0];
            const [form, setForm] = useState({ type: 'expense', amount: '', category: '', date: today, subCategory: '現金' });
            const [editingId, setEditingId] = useState(null);
            const [filter, setFilter] = useState({ start: '2026-01-01', end: '2026-12-31', query: '', subFilter: [] });

            const handleAdd = (e) => {
                e.preventDefault();
                if (!form.amount || !form.category) return;
                const item = { ...form, id: editingId || Date.now().toString(), amount: Number(form.amount) };
                if (editingId) {
                    setTransactions(transactions.map(t => t.id === editingId ? item : t).sort((a,b)=>b.date.localeCompare(a.date)));
                } else {
                    setTransactions([item, ...transactions].sort((a,b)=>b.date.localeCompare(a.date)));
                }
                setForm({ ...form, amount: '', category: '', date: today }); 
                setEditingId(null);
            };

            const handleEdit = (t) => {
                setEditingId(t.id);
                setForm(t);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const toggleSubFilter = (sub) => setFilter(f => ({ ...f, subFilter: f.subFilter.includes(sub) ? f.subFilter.filter(s=>s!==sub) : [...f.subFilter, sub] }));

            const filtered = transactions.filter(t => {
                const dateMatch = t.date >= filter.start && t.date <= filter.end;
                const queryMatch = !filter.query || t.category.includes(filter.query);
                const subMatch = filter.subFilter.length === 0 || filter.subFilter.includes(t.subCategory);
                return dateMatch && queryMatch && subMatch;
            });

            const stats = useMemo(() => {
                const income = filtered.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
                const expense = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
                return { income, expense, total: income - expense };
            }, [filtered]);

            return (
                <div className="space-y-6 animate-slide-up">
                    <form onSubmit={handleAdd} className="bg-white p-6 rounded-[2.5rem] border border-slate-100 space-y-4 shadow-sm">
                        <div className="flex justify-between items-center mb-2">
                            <h3 className="text-[10px] font-black text-emerald-600 uppercase tracking-widest">
                                {editingId ? '正在修正紀錄' : '快速記帳'}
                            </h3>
                            {editingId && (
                                <button type="button" onClick={() => {setEditingId(null); setForm({...form, amount:'', category:''})}} className="text-[10px] font-bold text-slate-300">取消修改</button>
                            )}
                        </div>
                        <div className="flex p-1 bg-slate-100/50 rounded-2xl">
                            <button type="button" onClick={() => setForm({...form, type:'expense', subCategory: TX_SUB_CATEGORIES.expense[0]})} className={`flex-1 py-2 text-[10px] font-black rounded-xl transition-all ${form.type === 'expense' ? 'bg-white text-red-500 shadow-sm' : 'text-slate-400'}`}>支出</button>
                            <button type="button" onClick={() => setForm({...form, type:'income', subCategory: TX_SUB_CATEGORIES.income[0]})} className={`flex-1 py-2 text-[10px] font-black rounded-xl transition-all ${form.type === 'income' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-400'}`}>收入</button>
                        </div>
                        
                        <div className="flex gap-1 overflow-x-auto no-scrollbar py-1">
                            {TX_SUB_CATEGORIES[form.type].map(sub => (
                                <button key={sub} type="button" onClick={()=>setForm({...form, subCategory: sub})} className={`px-4 py-2 rounded-xl text-[10px] font-black border transition-all ${form.subCategory === sub ? 'bg-emerald-600 text-white border-emerald-600 shadow-md' : 'bg-white text-slate-400 border-slate-100'}`}>{sub}</button>
                            ))}
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                            <input type="date" value={form.date} onChange={e=>setForm({...form, date:e.target.value})} className="bg-slate-50 p-3 rounded-2xl text-xs font-bold outline-none border-none"/>
                            <input type="text" placeholder="項目內容" value={form.category} onChange={e=>setForm({...form, category:e.target.value})} className="bg-slate-50 p-3 rounded-2xl text-xs font-bold outline-none border-none"/>
                        </div>
                        <input type="number" placeholder="輸入金額" value={form.amount} onChange={e=>setForm({...form, amount:e.target.value})} className={`w-full p-4 bg-slate-50 rounded-2xl font-black text-2xl outline-none text-center ${form.type === 'expense' ? 'text-red-500' : 'text-emerald-700'}`} />
                        <button type="submit" className={`w-full py-4 rounded-[2rem] font-black text-white shadow-lg transition-all active:scale-95 ${editingId ? 'bg-orange-500' : 'bg-emerald-800'}`}>
                            {editingId ? '確認修正紀錄' : '儲存這筆紀錄'}
                        </button>
                    </form>

                    <div className="bg-white p-6 rounded-[2.5rem] border border-slate-100 space-y-4 shadow-sm">
                        <div className="flex flex-col gap-3">
                            <div className="flex gap-2 items-center bg-slate-50 p-2 rounded-2xl border border-slate-100">
                                <input type="date" value={filter.start} onChange={e=>setFilter({...filter, start:e.target.value})} className="bg-transparent text-[10px] font-bold outline-none w-full"/>
                                <span className="text-slate-300">~</span>
                                <input type="date" value={filter.end} onChange={e=>setFilter({...filter, end:e.target.value})} className="bg-transparent text-[10px] font-bold outline-none w-full"/>
                            </div>
                            <input type="text" placeholder="關鍵字搜尋紀錄..." value={filter.query} onChange={e=>setFilter({...filter, query:e.target.value})} className="w-full p-3 bg-slate-50 rounded-2xl outline-none text-xs font-bold" />
                            
                            <div className="flex gap-1 overflow-x-auto no-scrollbar py-1">
                                {['現金','LinePay','信用卡','轉帳','其它'].map(sub => (
                                    <button key={sub} onClick={()=>toggleSubFilter(sub)} className={`px-3 py-1.5 rounded-xl text-[9px] font-black border transition-all ${filter.subFilter.includes(sub)?'bg-emerald-600 text-white border-emerald-600 shadow-sm':'bg-white text-slate-300 border-slate-100'}`}>{sub}</button>
                                ))}
                            </div>
                            
                            <div className="grid grid-cols-3 gap-2 pt-3 border-t border-slate-50">
                                <div className="text-center p-2 bg-emerald-50/50 rounded-2xl border border-emerald-100/50">
                                    <p className="text-[8px] font-black text-emerald-600 uppercase mb-0.5 tracking-tighter">區間總收入</p>
                                    <p className="text-[11px] font-black text-emerald-700">+{stats.income.toLocaleString()}</p>
                                </div>
                                <div className="text-center p-2 bg-red-50/50 rounded-2xl border border-red-100/50">
                                    <p className="text-[8px] font-black text-red-500 uppercase mb-0.5 tracking-tighter">區間總支出</p>
                                    <p className="text-[11px] font-black text-red-600">-{stats.expense.toLocaleString()}</p>
                                </div>
                                <div className={`text-center p-2 rounded-2xl border ${stats.total >= 0 ? 'bg-slate-50 border-slate-100' : 'bg-orange-50/50 border-orange-100/50'}`}>
                                    <p className="text-[8px] font-black text-slate-400 uppercase mb-0.5 tracking-tighter">區間淨結餘</p>
                                    <p className={`text-[11px] font-black ${stats.total >= 0 ? 'text-slate-700' : 'text-orange-600'}`}>
                                        {stats.total >= 0 ? '+' : ''}{stats.total.toLocaleString()}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="space-y-3 pb-12">
                        {filtered.map(t => (
                            <div key={t.id} className="bg-white p-5 rounded-2xl border border-emerald-50 flex justify-between items-center shadow-sm">
                                <div className="flex items-center gap-3">
                                    <div className={`w-1 h-10 rounded-full ${t.type === 'income' ? 'bg-emerald-500' : 'bg-red-500'}`}></div>
                                    <div>
                                        <p className="font-bold text-sm text-slate-700">{t.category} <span className="text-[9px] font-normal text-slate-300">· {t.subCategory}</span></p>
                                        <p className="text-[9px] font-bold text-slate-300 uppercase">{t.date}</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="text-right mr-1">
                                        <p className={`font-black ${t.type==='expense'?'text-red-500':'text-emerald-600'}`}>
                                            {t.type==='expense' ? '-' : '+'}{t.amount.toLocaleString()}
                                        </p>
                                    </div>
                                    <button onClick={()=>handleEdit(t)} className="p-2 text-slate-200 hover:text-emerald-600 transition-colors"><Icon name="edit" size={16}/></button>
                                    <button onClick={()=>setTransactions(transactions.filter(x=>x.id!==t.id))} className="p-2 text-slate-200 hover:text-red-500 transition-colors"><Icon name="trash" size={16}/></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function AssetsManager({ assets, setAssets, formatMoney, usdRate }) {
            const today = new Date().toISOString().split('T')[0];
            const [form, setForm] = useState({ name: '', type: 'cash', subType: '活存', value: '', currency: 'TWD', date: today });
            const [editingId, setEditingId] = useState(null);

            const handleAdd = (e) => {
                e.preventDefault();
                if (!form.name || !form.value) return;
                const item = { ...form, id: editingId || Date.now().toString(), value: Number(form.value) };
                if (editingId) setAssets(assets.map(a => a.id === editingId ? item : a).sort((a,b)=>b.date.localeCompare(a.date)));
                else setAssets([item, ...assets].sort((a,b)=>b.date.localeCompare(a.date)));
                setForm({ ...form, name: '', value: '', date: today }); setEditingId(null);
            };

            return (
                <div className="space-y-6 animate-slide-up">
                    <form onSubmit={handleAdd} className="bg-white p-6 rounded-[2.5rem] border border-slate-100 space-y-4 shadow-sm">
                        <input type="text" placeholder="資產名稱" value={form.name} onChange={e=>setForm({...form, name:e.target.value})} className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold text-sm" />
                        <div className="grid grid-cols-2 gap-2">
                            <select value={form.type} onChange={e=>{const t=e.target.value; setForm({...form, type:t, subType:ASSET_CATEGORIES[t].subTypes[0]})}} className="p-4 bg-slate-50 rounded-2xl text-xs font-bold outline-none border-none">
                                {Object.keys(ASSET_CATEGORIES).map(k => <option key={k} value={k}>{ASSET_CATEGORIES[k].label}</option>)}
                            </select>
                            <select value={form.currency} onChange={e=>setForm({...form, currency:e.target.value})} className="p-4 bg-slate-50 rounded-2xl text-xs font-bold outline-none border-none">
                                <option value="TWD">TWD</option>
                                <option value="USD">USD</option>
                            </select>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                             <div className="flex flex-wrap gap-1 p-1 bg-slate-100/50 rounded-2xl border border-slate-100 col-span-2 overflow-x-auto no-scrollbar">
                                {ASSET_CATEGORIES[form.type].subTypes.map(st => (
                                    <button key={st} type="button" onClick={()=>setForm({...form, subType:st})} className={`flex-1 py-2 px-3 text-[10px] font-black rounded-xl transition-all ${form.subType===st ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400'}`}>
                                        {st}
                                    </button>
                                ))}
                            </div>
                            <input type="date" value={form.date} onChange={e=>setForm({...form, date:e.target.value})} className="p-4 bg-slate-50 rounded-2xl text-xs font-bold outline-none border-none col-span-2" />
                        </div>
                        <input type="number" placeholder="目前金額" value={form.value} onChange={e=>setForm({...form, value:e.target.value})} className={`w-full p-4 bg-slate-50 rounded-2xl font-black text-2xl outline-none ${form.type==='debt'?'text-red-500':'text-emerald-700'}`} />
                        <button type="submit" className="w-full bg-emerald-800 text-white py-4 rounded-[2rem] font-black shadow-lg active:scale-95 transition-all">
                            {editingId ? '確認修正' : '新增資產'}
                        </button>
                    </form>

                    <div className="space-y-3 pb-12">
                        {assets.map(a => (
                            <div key={a.id} className="bg-white p-5 rounded-2xl border border-emerald-50 flex justify-between items-center shadow-sm">
                                <div className="flex items-center gap-3">
                                    <div className="w-2 h-10 rounded-full" style={{ backgroundColor: ASSET_CATEGORIES[a.type].color }}></div>
                                    <div>
                                        <p className="font-bold text-sm text-slate-700">{a.name} <span className="text-[9px] font-normal text-slate-300">· {a.subType}</span></p>
                                        <p className="text-[9px] font-bold text-slate-300 uppercase">{a.date}</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="text-right mr-1">
                                        <p className={`font-black ${a.type==='debt'?'text-red-500':'text-slate-800'}`}>
                                            {formatMoney(a.currency === 'USD' ? a.value * usdRate : a.value)}
                                        </p>
                                        {a.currency === 'USD' && <p className="text-[9px] text-slate-400 font-bold">${a.value.toLocaleString()} USD</p>}
                                    </div>
                                    <button onClick={()=>{setEditingId(a.id); setForm(a); window.scrollTo({top:0, behavior:'smooth'})}} className="p-2 text-slate-200 hover:text-emerald-600"><Icon name="edit" size={16}/></button>
                                    <button onClick={()=>setAssets(assets.filter(x=>x.id!==a.id))} className="p-2 text-slate-200 hover:text-red-500"><Icon name="trash" size={16}/></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
